<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse operator</title>
<style>
  :root { --bg:#eef1f5; --card:#fff; --ink:#1b1f2a; --mute:#667085; --accent:#2b4acb; --line:#d9dee7; --ok:#12805c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:1.1rem; margin:0 auto 0 0; }
  button, select, input[type=text] { font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.live { background:#c0362c; border-color:#c0362c; color:#fff; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid #9fb4ff; outline-offset:2px; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:20px; max-width:1200px; margin:0 auto; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  h2 { font-size:1rem; margin:0 0 10px; }
  #transcript { height:260px; overflow:auto; white-space:pre-wrap; color:var(--mute); }
  #transcript b { color:var(--ink); font-weight:600; }
  .row { display:flex; gap:8px; margin-bottom:12px; }
  .row input { flex:1; }
  .item { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .item.onscreen { border-color:var(--ok); box-shadow:inset 3px 0 0 var(--ok); }
  .item h3 { margin:0 0 4px; font-size:1rem; }
  .item p { margin:0 0 10px; color:var(--mute); font-family:Georgia,serif; }
  .item .btns { display:flex; gap:8px; }
  #status { color:var(--mute); font-size:.9rem; }
  label.chk { display:flex; gap:6px; align-items:center; font-size:.95rem; }
</style>
</head>
<body>
<header>
  <h1>Verse operator</h1>
  <label class="chk"><input type="checkbox" id="auto"> Show detected verses automatically</label>
  <select id="tr" aria-label="Translation">
    <option value="kjv">KJV</option>
    <option value="web">WEB</option>
  </select>
  <select id="lang" aria-label="Speech language">
    <option value="en-NG">English (Nigeria)</option>
    <option value="en-US">English (US)</option>
    <option value="en-GB">English (UK)</option>
  </select>
  <button id="openDisplay">Open display window</button>
  <button id="mic" class="primary">Start listening</button>
</header>

<main>
  <section>
    <h2>What the preacher said</h2>
    <div id="transcript" aria-live="polite"></div>
    <div id="status"></div>
  </section>

  <section>
    <h2>Verses</h2>
    <form class="row" id="manual">
      <input type="text" id="manualRef" placeholder="Type a reference, e.g. Romans 8:28" aria-label="Reference">
      <button type="submit">Find</button>
    </form>
    <div id="list"><p style="color:var(--mute)">Detected verses will appear here. Click “Show on screen” to display one.</p></div>
    <button id="clear">Clear the screen</button>
  </section>
</main>

<script src="parser.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const channel = new BroadcastChannel("verse-screen");
  let recog = null, listening = false, recent = [];

  function show(v, el) {
    channel.postMessage(v);
    document.querySelectorAll(".item").forEach((i) => i.classList.remove("onscreen"));
    if (el) el.classList.add("onscreen");
  }

  async function addVerse(ref) {
    const key = ref.toLowerCase();
    if (recent.includes(key)) return;           // ignore repeats of the same verse
    recent = [key, ...recent].slice(0, 5);

    const list = $("list");
    if (list.querySelector("p")) list.innerHTML = "";
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<h3></h3><p>Loading…</p><div class="btns"></div>`;
    el.querySelector("h3").textContent = ref;
    list.prepend(el);

    try {
      const r = await fetch(`/api/verse?ref=${encodeURIComponent(ref)}&t=${$("tr").value}`);
      const v = await r.json();
      if (!r.ok) throw new Error(v.error || "Not found");
      el.querySelector("h3").textContent = `${v.reference} (${v.translation})`;
      el.querySelector("p").textContent = v.text.length > 220 ? v.text.slice(0, 220) + "…" : v.text;
      const b = el.querySelector(".btns");
      const go = document.createElement("button");
      go.className = "primary"; go.textContent = "Show on screen";
      go.onclick = () => show(v, el);
      const rm = document.createElement("button");
      rm.textContent = "Dismiss"; rm.onclick = () => el.remove();
      b.append(go, rm);
      if ($("auto").checked) show(v, el);
    } catch (e) {
      el.querySelector("p").textContent = "Could not load this verse: " + e.message;
    }
  }

  function startListening() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { $("status").textContent = "Speech recognition needs Chrome or Edge."; return; }
    recog = new SR();
    recog.continuous = true;
    recog.interimResults = true;
    recog.lang = $("lang").value;
    recog.onresult = (e) => {
      let interim = "", finalText = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t + " "; else interim += t;
      }
      const box = $("transcript");
      if (finalText) {
        box.dataset.text = ((box.dataset.text || "") + finalText).slice(-4000);
        detectReferences(finalText).forEach(addVerse);
      }
      box.innerHTML = "";
      const b = document.createElement("b"); b.textContent = (box.dataset.text || "");
      box.append(b, document.createTextNode(interim));
      box.scrollTop = box.scrollHeight;
    };
    recog.onerror = (e) => { $("status").textContent = "Mic error: " + e.error; };
    recog.onend = () => { if (listening) recog.start(); };   // Chrome stops after silence, so restart
    recog.start();
    listening = true;
    $("mic").textContent = "Stop listening"; $("mic").className = "live";
    $("status").textContent = "Listening…";
  }

  function stopListening() {
    listening = false; recog && recog.stop();
    $("mic").textContent = "Start listening"; $("mic").className = "primary";
    $("status").textContent = "";
  }

  $("mic").onclick = () => (listening ? stopListening() : startListening());
  $("openDisplay").onclick = () => window.open("display.html", "verse-display", "width=1280,height=720");
  $("clear").onclick = () => show(null);
  $("manual").onsubmit = (e) => {
    e.preventDefault();
    const found = detectReferences($("manualRef").value);
    found.forEach((r) => { recent = recent.filter((x) => x !== r.toLowerCase()); addVerse(r); });
    if (!found.length) $("status").textContent = "Could not read that reference.";
    $("manualRef").value = "";
  };
</script>
</body>
</html>
