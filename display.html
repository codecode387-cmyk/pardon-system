<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --text:#f4f2ed; --ref:#a9c0ff; --mute:#8d97b5; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  html { background:#000; }
  body {
    display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--text);
    font-family: Lora, Georgia, "Times New Roman", serif;
    background:
      radial-gradient(1300px 760px at 12% 0%, #1e3170 0%, transparent 62%),
      radial-gradient(1000px 700px at 100% 100%, #2b1b55 0%, transparent 58%),
      #080d20;
  }
  body.idle { cursor:none; }

  /* ?bg=black : plain black background instead of the blue gradient (clean for EasyWorship / OBS capture) */
  body.bgblack { background:#000; }

  .stage { width:min(1500px, 86vw); opacity:0; transition:opacity .25s ease; }
  .stage.show { opacity:1; }

  #ref { display:flex; align-items:center; gap:18px; margin:0 0 .55em; color:var(--ref);
         font-size:clamp(22px, 4.2vh, 48px); font-weight:600; letter-spacing:.005em; }
  #ref::before { content:""; width:56px; height:3px; border-radius:2px; background:var(--ref); flex:none; }
  #text { margin:0; font-weight:500; line-height:1.32; text-wrap:pretty; }
  .meta { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 18px; margin-top:1.3em;
          font-family:Inter, system-ui, sans-serif; }
  #tr { color:var(--ref); font-weight:600; font-size:clamp(14px, 2.2vh, 24px); }
  #copy { color:var(--mute); font-weight:500; font-size:clamp(10px, 1.4vh, 15px); max-width:70ch; }

  /* Lower third: sits at the bottom of the picture.
     Solid black behind it by default, so it never turns white in a window capture or a projector.
     Add ?alpha=1 only when this page is used as an OBS Browser Source and you want it see-through. */
  body[data-layout="lower"] { background:#000; align-items:flex-end; padding-bottom:5vh; }
  body.alpha[data-layout="lower"] { background:transparent; }
  html.alpha { background:transparent; }
  body[data-layout="lower"] .stage {
    width:92vw; padding:2.2vh 2.4vw; border-radius:14px; border-left:6px solid var(--ref);
    background:rgba(8,13,32,.9);
  }
  body[data-layout="lower"] #ref { font-size:clamp(16px, 2.8vh, 30px); margin-bottom:.3em; }
  body[data-layout="lower"] #ref::before { display:none; }
  body[data-layout="lower"] .meta { margin-top:.7em; }

  #idle { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
          font-family:Inter, system-ui, sans-serif; color:#5b668c; font-size:28px; }
  body.preview.empty #idle { display:flex; }
</style>
</head>
<body>
<main class="stage" id="stage" aria-live="polite">
  <h1 id="ref"></h1>
  <p id="text"></p>
  <div class="meta"><span id="tr"></span><span id="copy"></span></div>
</main>
<div id="idle">Waiting for a verse</div>

<script>
  // Options in the address:
  //   display.html                      same browser as the operator page (instant)
  //   display.html?room=CODE            works in ANY browser or program (EasyWorship browser, OBS...) through the relay
  //   &bg=black   flat black background      &alpha=1   see-through lower third (OBS Browser Source only)
  const params = new URLSearchParams(location.search);
  const preview = params.has("preview");
  const room = (params.get("room") || "").trim().toLowerCase();
  const LS = "vs:current";
  // Some embedded browsers have no BroadcastChannel. The page then still works through the storage channel below.
  const ch = ("BroadcastChannel" in window) ? new BroadcastChannel("verse-screen") : { postMessage() {}, set onmessage(_) {} };
  const $ = (id) => document.getElementById(id);
  let lastTs = 0, hideTimer = null;

  if (preview) document.body.classList.add("preview");
  if (params.get("bg") === "black") document.body.classList.add("bgblack");
  if (params.has("alpha")) { document.body.classList.add("alpha"); document.documentElement.classList.add("alpha"); }
  document.body.classList.add("empty");

  function fit() {
    const t = $("text");
    const lower = document.body.dataset.layout === "lower";
    const maxH = innerHeight * (lower ? 0.22 : 0.56);
    let lo = 12, hi = Math.round(innerHeight * (lower ? 0.05 : 0.115)), best = lo;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      t.style.fontSize = mid + "px";
      if (t.offsetHeight <= maxH) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    t.style.fontSize = best + "px";
  }

  function render(v, layout) {
    document.body.dataset.layout = layout || "full";
    const stage = $("stage");
    stage.classList.remove("show");
    setTimeout(() => {
      $("ref").textContent = v.reference;
      $("text").textContent = v.text;
      $("tr").textContent = v.translation || "";
      $("copy").textContent = v.copyright || "";
      document.body.classList.remove("empty");
      fit();
      stage.classList.add("show");
    }, 160);
  }

  function clearScreen() {
    $("stage").classList.remove("show");
    document.body.classList.add("empty");
  }

  // Each message has a time stamp. The same or an older one is ignored, so the same-browser
  // channel and the relay can both deliver without showing anything twice or going backwards.
  function apply(m) {
    if (!m || (m.ts && m.ts <= lastTs)) return;
    if (m.ts) lastTs = m.ts;
    if (m.type === "show") render(m.verse, m.layout);
    else if (m.type === "clear") clearScreen();
  }

  ch.onmessage = (e) => {
    if (e.data && e.data.type === "ping") { if (!preview) ch.postMessage({ type: "pong" }); }
    else apply(e.data);
  };

  // Second channel: localStorage. Also lets the display recover if it is reloaded.
  window.addEventListener("storage", (e) => {
    if (e.key !== LS) return;
    try { apply(JSON.parse(e.newValue)); } catch (_) {}
  });
  try {
    const saved = JSON.parse(localStorage.getItem(LS) || "null");
    if (saved && Date.now() - saved.ts < 6 * 3600 * 1000) apply(saved);
  } catch (_) {}

  /* ---------- relay: works when the display is NOT in the same browser as the operator page ---------- */
  if (room && !preview) {
    let lastChange = Date.now();
    const poll = async () => {
      try {
        const r = await fetch("/api/state?room=" + encodeURIComponent(room), { cache: "no-store" });
        if (r.ok) {
          const d = await r.json();
          const s = d && d.state;
          if (s && !(s.ts && Date.now() - s.ts > 6 * 3600 * 1000)) {
            const before = lastTs;
            apply(s);
            if (lastTs !== before) lastChange = Date.now();
          }
        }
      } catch (_) { /* internet blip: just try again */ }
      // quick while the service is active, slower when nothing has changed for a while
      setTimeout(poll, Date.now() - lastChange < 30000 ? 600 : 1500);
    };
    poll();
  }

  addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  // Hide the mouse pointer on the projector
  addEventListener("mousemove", () => {
    document.body.classList.remove("idle");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => document.body.classList.add("idle"), 2000);
  });

  // Fullscreen: double-click the screen or press F (the same as F11, but also works when captured)
  function toggleFullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (_) {}
  }
  if (!preview) {
    addEventListener("dblclick", toggleFullscreen);
    addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") toggleFullscreen(); });

    // Keep the projector computer awake for the whole service
    let wake = null;
    const keepAwake = async () => {
      try { if ("wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); } catch (_) {}
    };
    keepAwake();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
  }
</script>
</body>
</html>
