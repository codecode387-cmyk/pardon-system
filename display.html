<!doctype html>
<html lang="en" style="background:#000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Verse display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme:dark; --text:#f4f2ed; --ref:#a9c0ff; --mute:#8d97b5; }
  * { box-sizing:border-box; }
  html, body { width:100%; height:100%; margin:0; background-color:#000; }
  body {
    display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--text);
    font-family: Lora, Georgia, "Times New Roman", serif;
    background-color:#080d20;
    background-image:
      radial-gradient(1300px 760px at 12% 0%, #1e3170 0%, transparent 62%),
      radial-gradient(1000px 700px at 100% 100%, #2b1b55 0%, transparent 58%);
  }
  body.idle { cursor:none; }

  /* ?bg=black : plain black background instead of the blue gradient (clean for EasyWorship / OBS capture) */
  body.bgblack { background-color:#000; background-image:none; }

  /* Everything is centered: the stage sits in the middle of the screen and its text is centered inside it. */
  .stage { width:88vw; max-width:1500px; margin:0 auto; text-align:center; opacity:0; transition:opacity .25s ease; }
  .stage.show { opacity:1; }

  #ref { display:flex; align-items:center; justify-content:center; gap:18px; margin:0 0 .55em; color:var(--ref);
         font-size:4.2vh; font-weight:600; letter-spacing:.005em; text-align:center; }
  #ref::before, #ref::after { content:""; width:56px; height:3px; border-radius:2px; background:var(--ref); flex:none; }
  #text { margin:0 auto; font-weight:500; line-height:1.32; text-align:center; }
  .meta { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:center; gap:6px 18px; margin-top:1.3em;
          font-family:Inter, system-ui, sans-serif; text-align:center; }
  #tr { color:var(--ref); font-weight:600; font-size:2.2vh; }
  #copy { color:var(--mute); font-weight:500; font-size:1.4vh; max-width:70ch; }

  /* Lower third: sits at the bottom of the picture, centered.
     Solid black behind it by default, so it never turns white in a window capture or a projector.
     Add ?alpha=1 only when this page is used as an OBS Browser Source and you want it see-through. */
  body[data-layout="lower"] { background-color:#000; background-image:none; align-items:flex-end; justify-content:center; padding-bottom:5vh; }
  body.alpha[data-layout="lower"] { background-color:transparent; }
  html.alpha, html.alpha body { background-color:transparent; }
  body[data-layout="lower"] .stage {
    width:92vw; max-width:none; padding:2.2vh 2.4vw; border-radius:14px;
    border-top:5px solid var(--ref);
    background:rgba(8,13,32,.9);
  }
  body[data-layout="lower"] #ref { font-size:2.8vh; margin-bottom:.3em; }
  body[data-layout="lower"] #ref::before, body[data-layout="lower"] #ref::after { display:none; }
  body[data-layout="lower"] .meta { margin-top:.7em; }

  #idle { position:fixed; left:0; top:0; right:0; bottom:0; display:none; align-items:center; justify-content:center;
          font-family:Inter, system-ui, sans-serif; color:#5b668c; font-size:28px; }
  body.preview.empty #idle { display:flex; }

  /* Small status line at the bottom: shows for a few seconds after loading, and stays if something is wrong. */
  #status { position:fixed; left:0; right:0; bottom:10px; text-align:center; font:13px/1.3 Inter, system-ui, sans-serif;
            color:#7a86a8; opacity:0; transition:opacity .4s ease; pointer-events:none; padding:0 16px; }
  #status.on { opacity:1; }
  #status.bad { color:#ff8f8f; }
  body.preview #status { display:none; }
</style>
</head>
<body>
<main class="stage" id="stage" aria-live="polite">
  <h1 id="ref"></h1>
  <p id="text"></p>
  <div class="meta"><span id="tr"></span><span id="copy"></span></div>
</main>
<div id="idle">Waiting for a verse</div>
<div id="status" role="status"></div>

<script>
  // Options in the address:
  //   display.html                      same browser as the operator page (instant)
  //   display.html?room=CODE            works in ANY browser or program (EasyWorship browser, OBS, another computer) through the relay
  //   &bg=black   flat black background      &alpha=1   see-through lower third (OBS Browser Source only)
  var params = new URLSearchParams(location.search);
  var preview = params.has("preview");
  var room = (params.get("room") || "").trim().toLowerCase();
  var LS = "vs:current";
  // Some embedded browsers have no BroadcastChannel. The page then still works through the storage channel and the relay.
  var ch = ("BroadcastChannel" in window) ? new BroadcastChannel("verse-screen") : { postMessage: function () {}, set onmessage(_) {} };
  var $ = function (id) { return document.getElementById(id); };
  var lastTs = 0, hideTimer = null, statusTimer = null;

  function setStatus(text, bad, sticky) {
    var el = $("status");
    el.textContent = text;
    el.className = "on" + (bad ? " bad" : "");
    clearTimeout(statusTimer);
    if (!sticky) statusTimer = setTimeout(function () { el.className = ""; }, 6000);
  }
  // If anything breaks, say so on the screen instead of leaving it blank.
  window.addEventListener("error", function (e) { setStatus("Display error: " + (e.message || "unknown"), true, true); });

  if (preview) document.body.classList.add("preview");
  if (params.get("bg") === "black") document.body.classList.add("bgblack");
  if (params.has("alpha")) { document.body.classList.add("alpha"); document.documentElement.classList.add("alpha"); }
  document.body.classList.add("empty");

  function fit() {
    var t = $("text");
    var lower = document.body.dataset.layout === "lower";
    var maxH = innerHeight * (lower ? 0.22 : 0.56);
    var lo = 12, hi = Math.round(innerHeight * (lower ? 0.05 : 0.115)), best = lo;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      t.style.fontSize = mid + "px";
      if (t.offsetHeight <= maxH) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    t.style.fontSize = best + "px";
  }

  function render(v, layout) {
    document.body.dataset.layout = layout || "full";
    var stage = $("stage");
    stage.classList.remove("show");
    setTimeout(function () {
      $("ref").textContent = v.reference;
      $("text").textContent = v.text;
      $("tr").textContent = v.translation || "";
      $("copy").textContent = v.copyright || "";
      document.body.classList.remove("empty");
      fit();
      stage.classList.add("show");
    }, 160);
  }

  function clearScreen() {
    $("stage").classList.remove("show");
    document.body.classList.add("empty");
  }

  // Each message has a time stamp. The same or an older one is ignored, so the same-browser
  // channel and the relay can both deliver without showing anything twice or going backwards.
  function apply(m) {
    if (!m || (m.ts && m.ts <= lastTs)) return;
    if (m.ts) lastTs = m.ts;
    if (m.type === "show") render(m.verse, m.layout);
    else if (m.type === "clear") clearScreen();
  }

  ch.onmessage = function (e) {
    if (e.data && e.data.type === "ping") { if (!preview) ch.postMessage({ type: "pong" }); }
    else apply(e.data);
  };

  // Second channel: localStorage. Also lets the display recover if it is reloaded.
  window.addEventListener("storage", function (e) {
    if (e.key !== LS) return;
    try { apply(JSON.parse(e.newValue)); } catch (_) {}
  });
  try {
    var saved = JSON.parse(localStorage.getItem(LS) || "null");
    if (saved && Date.now() - saved.ts < 6 * 3600 * 1000) apply(saved);
  } catch (_) {}

  /* ---------- relay: works when the display is NOT in the same browser as the operator page ---------- */
  if (room && !preview) {
    var lastChange = Date.now();
    var relayOk = null;                                   // null = unknown, true = working, false = problem
    setStatus("Connecting to the operator…", false);
    var poll = function () {
      fetch("/api/state?room=" + encodeURIComponent(room), { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) {
            relayOk = false;
            setStatus(r.status === 501
              ? "Relay is not set up yet (connect Upstash Redis in Vercel and redeploy)."
              : "Cannot reach the operator link (error " + r.status + "). Retrying…", true, true);
            return null;
          }
          if (relayOk !== true) { relayOk = true; setStatus("Connected. Waiting for the operator.", false); }
          return r.json();
        })
        .then(function (d) {
          var s = d && d.state;
          if (s && !(s.ts && Date.now() - s.ts > 6 * 3600 * 1000)) {
            var before = lastTs;
            apply(s);
            if (lastTs !== before) lastChange = Date.now();
          }
        })
        .catch(function () {
          if (relayOk !== false) { relayOk = false; setStatus("No internet connection. Retrying…", true, true); }
        })
        .then(function () {
          // quick while the service is active, slower when nothing has changed for a while
          setTimeout(poll, Date.now() - lastChange < 30000 ? 600 : 1500);
        });
    };
    poll();
  } else if (!preview) {
    setStatus("Display ready. Same-browser mode: for another computer, use the link with ?room= from the operator page.", false);
  }

  addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  // Hide the mouse pointer on the projector
  addEventListener("mousemove", function () {
    document.body.classList.remove("idle");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { document.body.classList.add("idle"); }, 2000);
  });

  // Fullscreen: double-click the screen or press F (the same as F11, but also works when captured)
  function toggleFullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (_) {}
  }
  if (!preview) {
    addEventListener("dblclick", toggleFullscreen);
    addEventListener("keydown", function (e) { if (e.key === "f" || e.key === "F") toggleFullscreen(); });

    // Keep the projector computer awake for the whole service
    var wake = null;
    var keepAwake = function () {
      try { if ("wakeLock" in navigator) navigator.wakeLock.request("screen").then(function (w) { wake = w; }, function () {}); } catch (_) {}
    };
    keepAwake();
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") keepAwake(); });
  }
</script>
</body>
</html>
