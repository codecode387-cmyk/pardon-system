<!doctype html>
<html lang="en" style="background:#000">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Verse display</title>
<!-- Written to work in old embedded browsers too (EasyWorship's web view): plain colours instead of CSS variables,
     no modern-only scripting, and the fonts load in the background so a slow connection can never leave the page white.
     Until they load, Georgia is used. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Lora:wght@400;500;600&display=swap" rel="stylesheet" media="print"
      onload="this.media='all'; if (document.fonts && document.fonts.ready && window.fit) document.fonts.ready.then(window.fit);">
<style>
  * { box-sizing:border-box; }
  html, body { width:100%; height:100%; margin:0; background-color:#000; }
  body {
    display:flex; align-items:center; justify-content:center; overflow:hidden; color:#f4f2ed;
    font-family: Lora, Georgia, "Times New Roman", serif;
    background-color:#080d20;
    background-image:
      radial-gradient(1300px 760px at 12% 0%, #1e3170 0%, transparent 62%),
      radial-gradient(1000px 700px at 100% 100%, #2b1b55 0%, transparent 58%);
  }
  body.idle { cursor:none; }

  /* ?bg=black : plain black background instead of the blue gradient (clean for EasyWorship / OBS capture) */
  body.bgblack { background-color:#000; background-image:none; }

  /* Everything is centered: the stage sits in the middle of the screen and its text is centered inside it. */
  .stage { display:block; width:88vw; max-width:1500px; margin:0 auto; text-align:center; opacity:0; transition:opacity .08s ease; }
  .stage.show { opacity:1; }

  #ref { display:flex; align-items:center; justify-content:center; margin:0 0 .55em; color:#a9c0ff;
         font-size:5.4vh; font-weight:600; letter-spacing:.005em; text-align:center; }
  #ref::before, #ref::after { content:""; width:56px; height:3px; margin:0 9px; border-radius:2px; background:#a9c0ff; flex:none; }
  #text { margin:0 auto; font-weight:500; line-height:1.32; text-align:center; color:#f4f2ed; }
  .meta { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:center; margin-top:1.3em;
          font-family:Inter, system-ui, "Segoe UI", Arial, sans-serif; text-align:center; }
  .meta span { margin:3px 9px; }
  /* Translation label, shown like (KJV): bold and large so it can be read on the TV */
  #tr { color:#c9d7ff; font-weight:800; font-size:3.6vh; letter-spacing:.02em; }
  #copy { color:#8d97b5; font-weight:500; font-size:1.4vh; max-width:70ch; }

  /* Lower third: sits at the bottom of the picture, centered.
     Solid black behind it by default, so it never turns white in a window capture or a projector.
     Add ?alpha=1 only when this page is used as an OBS Browser Source and you want it see-through. */
  body[data-layout="lower"] { background-color:#000; background-image:none; align-items:flex-end; justify-content:center; padding-bottom:5vh; }
  body.alpha[data-layout="lower"] { background-color:transparent; }
  html.alpha, html.alpha body { background-color:transparent; }
  body[data-layout="lower"] .stage {
    width:92vw; max-width:none; padding:2.2vh 2.4vw; border-radius:14px;
    border-top:5px solid #a9c0ff;
    background:rgba(8,13,32,.9);
  }
  body[data-layout="lower"] #ref { font-size:3.6vh; margin-bottom:.3em; }
  body[data-layout="lower"] #ref::before, body[data-layout="lower"] #ref::after { display:none; }
  body[data-layout="lower"] .meta { margin-top:.7em; }
  body[data-layout="lower"] #tr { font-size:3vh; }

  #idle { position:fixed; left:0; top:0; right:0; bottom:0; display:none; align-items:center; justify-content:center;
          font-family:Inter, system-ui, "Segoe UI", Arial, sans-serif; color:#5b668c; font-size:28px; }
  body.preview.empty #idle { display:flex; }

  /* Small status line at the bottom: shows for a few seconds after loading, and stays if something is wrong. */
  #status { position:fixed; left:0; right:0; bottom:10px; text-align:center; font:13px/1.3 Inter, system-ui, "Segoe UI", Arial, sans-serif;
            color:#7a86a8; opacity:0; transition:opacity .4s ease; pointer-events:none; padding:0 16px; }
  #status.on { opacity:1; }
  #status.bad { color:#ff8f8f; }
  body.preview #status { display:none; }
  #dbg { position:fixed; left:10px; top:10px; margin:0; padding:10px 12px; max-width:92vw; background:rgba(0,0,0,.78); color:#9fe3b5; border:1px solid #2c3550;
         border-radius:8px; font:13px/1.45 Consolas, Menlo, monospace; white-space:pre-wrap; display:none; z-index:9; }
  #dbg.on { display:block; }
</style>
</head>
<body>
<main class="stage" id="stage" aria-live="polite">
  <h1 id="ref"></h1>
  <p id="text"></p>
  <div class="meta"><span id="tr"></span><span id="copy"></span></div>
</main>
<div id="idle">Waiting for a verse</div>
<div id="status" role="status"></div>
<pre id="dbg"></pre>

<script>
  // Options in the address:
  //   display.html                      same browser as the operator page (instant)
  //   display.html?room=CODE            works in ANY browser or program (EasyWorship browser, OBS, another computer) through the relay
  //   &bg=black   flat black background      &alpha=1   see-through lower third (OBS Browser Source only)
  //   &debug=1    shows a small check panel

  // ---- Direct read from Upstash (skips Vercel's security check). READ-ONLY token only: it cannot change or delete anything. ----
  // If you ever reset the Upstash password, paste the new URL and the new READ-ONLY token here.
  var DIRECT_URL   = "https://suitable-anteater-202071.upstash.io";
  var DIRECT_TOKEN = "ggAAAAAAAxVXAAIgcDFea3NTwEAJEeJILYh-FAHZVpfHOjcbCV8iK1Udlt1VzQ";

  function qget(name) {
    var m = new RegExp("[?&]" + name + "(?:=([^&]*))?(?:&|$)").exec(location.search);
    if (!m) return null;
    try { return decodeURIComponent((m[1] || "").replace(/\+/g, " ")); } catch (e) { return m[1] || ""; }
  }
  var preview = qget("preview") !== null;
  var debugOn = qget("debug") !== null;
  var room = (qget("room") || "").replace(/^\s+|\s+$/g, "").toLowerCase();
  var LS = "vs:current";
  var LAST = "vs:last:" + room;                           // the last thing shown through the relay, so a reload shows it again at once
  var $ = function (id) { return document.getElementById(id); };
  var lastTs = 0, hideTimer = null, statusTimer = null;
  var MAX_AGE = 6 * 3600 * 1000;
  var RELAY_AGE = 12 * 3600 * 1000;                       // a verse sent more than 12 hours ago is not shown again by itself
  var swState = "not supported by this browser";

  // Some embedded browsers have no BroadcastChannel. The page then still works through the storage channel and the relay.
  var ch = null;
  try { if ("BroadcastChannel" in window) ch = new BroadcastChannel("verse-screen"); } catch (e) { ch = null; }

  function hasClass(el, c) { return (" " + el.className + " ").indexOf(" " + c + " ") > -1; }
  function addClass(el, c) { if (!hasClass(el, c)) el.className = (el.className ? el.className + " " : "") + c; }
  function removeClass(el, c) { el.className = (" " + el.className + " ").replace(" " + c + " ", " ").replace(/^\s+|\s+$/g, ""); }

  function setStatus(text, bad, sticky) {
    var el = $("status");
    el.textContent = text;
    el.className = "on" + (bad ? " bad" : "");
    clearTimeout(statusTimer);
    if (!sticky) statusTimer = setTimeout(function () { el.className = ""; }, 6000);
  }
  // If anything breaks, say so on the screen instead of leaving it blank.
  window.onerror = function (msg) { try { setStatus("Display error: " + msg, true, true); } catch (e) {} };

  if (preview) addClass(document.body, "preview");
  if (qget("bg") === "black") addClass(document.body, "bgblack");
  if (qget("alpha") !== null) { addClass(document.body, "alpha"); addClass(document.documentElement, "alpha"); }
  addClass(document.body, "empty");

  function fit() {
    var t = $("text");
    var lower = document.body.getAttribute("data-layout") === "lower";
    var maxH = window.innerHeight * (lower ? 0.22 : 0.56);
    var lo = 12, hi = Math.round(window.innerHeight * (lower ? 0.05 : 0.115)), best = lo;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      t.style.fontSize = mid + "px";
      if (t.offsetHeight <= maxH) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    t.style.fontSize = best + "px";
  }
  window.fit = fit;

  function render(v, layout) {
    document.body.setAttribute("data-layout", layout || "full");
    var stage = $("stage");
    removeClass(stage, "show");
    setTimeout(function () {
      $("ref").textContent = v.reference;
      $("text").textContent = v.text;
      $("tr").textContent = v.translation ? "(" + v.translation + ")" : "";   // shown as (KJV), (NIV) ...
      $("copy").textContent = v.copyright || "";
      removeClass(document.body, "empty");
      fit();
      addClass(stage, "show");
    }, 30);
  }

  function clearScreen() {
    removeClass($("stage"), "show");
    addClass(document.body, "empty");
  }

  // Each message has a time stamp. The same or an older one is ignored, so the same-browser
  // channel and the relay can both deliver without showing anything twice or going backwards.
  function apply(m) {
    if (!m || (m.ts && m.ts <= lastTs)) return;
    if (m.ts) lastTs = m.ts;
    if (m.type === "show") render(m.verse, m.layout);
    else if (m.type === "clear") clearScreen();
    if (room && !preview && (m.type === "show" || m.type === "clear")) {
      try { localStorage.setItem(LAST, JSON.stringify({ at: new Date().getTime(), m: m })); } catch (e) {}
    }
  }

  if (ch) {
    ch.onmessage = function (e) {
      if (e.data && e.data.type === "ping") { if (!preview) ch.postMessage({ type: "pong" }); }
      else apply(e.data);
    };
  }

  // Second channel: localStorage. Also lets the display recover if it is reloaded.
  window.addEventListener("storage", function (e) {
    if (e.key !== LS) return;
    try { apply(JSON.parse(e.newValue)); } catch (err) {}
  });
  try {
    var saved = JSON.parse(localStorage.getItem(LS) || "null");
    if (saved && new Date().getTime() - saved.ts < MAX_AGE) apply(saved);
  } catch (e) {}

  // After a reload with a room code: show the last verse again right away, even before the connection is back.
  if (room && !preview) {
    try {
      var last = JSON.parse(localStorage.getItem(LAST) || "null");
      if (last && last.m && last.at && new Date().getTime() - last.at < MAX_AGE) apply(last.m);
    } catch (e) {}
  }

  /* ---------- relay: works when the display is NOT in the same browser as the operator page ---------- */
  // One plain request with a time limit. cb(status, data, serverTimeHeader, bodyText); status 0 means no answer.
  function getUrl(url, cb) {
    var x, done = false, guard = null;
    try { x = new XMLHttpRequest(); } catch (e) { cb(0, null, null, ""); return; }
    var text = "";
    var finish = function (status, data, date) { if (done) return; done = true; clearTimeout(guard); cb(status, data, date, text); };
    guard = setTimeout(function () { try { x.abort(); } catch (e) {} finish(0, null, null); }, 6000);   // a hung request must not stop the display
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var d = null;
      try { text = String(x.responseText || ""); d = JSON.parse(text); } catch (e) {}
      var date = null;
      try { date = x.getResponseHeader("Date"); } catch (e) {}
      finish(x.status, d, date);
    };
    x.onerror = function () { finish(0, null, null); };
    try { x.open("GET", url, true); x.send(); } catch (e) { finish(0, null, null); }
  }

  // Way 1: read straight from Upstash. Way 2 (only if way 1 fails): the site's own /api/state.
  function directUrl() {
    return DIRECT_URL + "/get/" + encodeURIComponent("vs:room:" + room) + "?_token=" + encodeURIComponent(DIRECT_TOKEN);
  }
  function siteUrl() {
    return "/api/state?room=" + encodeURIComponent(room) + "&_=" + new Date().getTime();   // the extra number stops old browsers from reusing an old answer
  }
  // Upstash answers {"result": "<json text>"} or {"result": null}. Turn it into {state: ...} like the site route does.
  function fromDirect(d) {
    var raw = d && d.result, s = null;
    if (raw) { try { s = JSON.parse(raw); } catch (e) { s = null; } }
    return { state: s };
  }

  if (room && !preview) {
    var lastChange = new Date().getTime();
    var dbg = { polls: 0, http: "-", state: "-", shown: "-" };
    var showDbg = function () {
      if (!debugOn) return;
      var el = $("dbg");
      el.className = "on";
      el.textContent = "Verse display check\nroom code:      " + room + "\nchecks made:    " + dbg.polls + "\nlast reply:     " + dbg.http +
        "\nverse waiting:  " + dbg.state + "\nshown on screen: " + dbg.shown + "\noffline copy:    " + swState +
        "\nthis computer's time: " + new Date().toString() + "\nbrowser: " + navigator.userAgent;
    };
    var relayOk = null;                                   // null = unknown, true = working, false = problem

    var handle = function (status, d, dateHeader, bodyText, source) {
      var serverNow = (dateHeader && !isNaN(Date.parse(dateHeader))) ? Date.parse(dateHeader) : null;
      dbg.polls++;
      if (status === 0) {
        dbg.http = "no answer (slow or no internet)";
        if (relayOk !== false) { relayOk = false; setStatus("Slow or no internet connection. Showing the last verse. Retrying…", true, true); }
      } else if (status < 200 || status > 299) {
        var why = String(bodyText || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "").slice(0, 160);
        dbg.http = status + " (problem) " + source + (why ? ": " + why : "");
        relayOk = false;
        setStatus(status === 501
          ? "Relay is not set up yet (connect Upstash Redis in Vercel and redeploy)."
          : (status === 401 || status === 403)
            ? "The site refused this browser (error " + status + (why ? ": " + why.slice(0, 80) : "") + "). Retrying…"
            : "Cannot reach the operator link (error " + status + "). Retrying…", true, true);
      } else {
        dbg.http = status + " OK " + source;
        if (relayOk !== true) { relayOk = true; setStatus("Connected. Waiting for the operator.", false); }
        var s = d && d.state;
        dbg.state = s ? (s.type + (s.verse ? " " + s.verse.reference : "") + ((s.ts && serverNow) ? ", sent " + Math.round((serverNow - s.ts) / 60000) + " min ago" : "")) : "none yet (show a verse on the operator page)";
        // The saved verse is forgotten by the server after 12 hours, so an age check is only done when the server's clock is available.
        var tooOld = s && s.ts && serverNow && (serverNow - s.ts > RELAY_AGE);
        if (s && !tooOld) {
          var before = lastTs;
          apply(s);
          if (lastTs !== before) lastChange = new Date().getTime();
        }
      }
      dbg.shown = lastTs ? "yes" : "nothing yet";
      showDbg();
    };

    var next = function () {
      // quick while the service is active, slower when nothing has changed for a while
      setTimeout(poll, new Date().getTime() - lastChange < 30000 ? 300 : 1000);
    };

    var poll = function () {
      getUrl(directUrl(), function (status, d, dateHeader, bodyText) {
        if (status >= 200 && status <= 299) {
          handle(status, fromDirect(d), dateHeader, bodyText, "(direct)");
          next();
        } else {
          var firstStatus = status;
          getUrl(siteUrl(), function (status2, d2, date2, body2) {
            handle(status2, d2, date2, body2, "(site; direct gave " + (firstStatus || "no answer") + ")");
            next();
          });
        }
      });
    };

    setStatus("Connecting to the operator…", false);
    poll();
  } else if (!preview) {
    setStatus("Display ready. Same-browser mode: for another computer, use the link with ?room= from the operator page.", false);
  }

  window.addEventListener("resize", fit);
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); } catch (e) {}

  // Hide the mouse pointer on the projector
  window.addEventListener("mousemove", function () {
    removeClass(document.body, "idle");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { addClass(document.body, "idle"); }, 2000);
  });

  // Fullscreen: double-click the screen or press F (the same as F11, but also works when captured)
  function toggleFullscreen() {
    try {
      var d = document, el = d.documentElement;
      if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
      else { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
    } catch (e) {}
  }
  if (!preview) {
    window.addEventListener("dblclick", toggleFullscreen);
    window.addEventListener("keydown", function (e) { if (e.key === "f" || e.key === "F") toggleFullscreen(); });

    // Keep a saved copy of this page on this computer, so a refresh never shows a white screen (see sw.js).
    try {
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        navigator.serviceWorker.register("/sw.js").then(function () { swState = "ready"; }, function (e) { swState = "could not start: " + ((e && e.message) || "error"); });
      } else if ("serviceWorker" in navigator) { swState = "needs https"; }
    } catch (e) {}

    // Keep the projector computer awake for the whole service
    var keepAwake = function () {
      try { if ("wakeLock" in navigator) navigator.wakeLock.request("screen").then(function () {}, function () {}); } catch (e) {}
    };
    keepAwake();
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") keepAwake(); });
  }
</script>
</body>
</html>
